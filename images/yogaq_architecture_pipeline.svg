<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="npuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="guardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="940" height="330" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="940" height="42" rx="14" fill="url(#headerGrad)" />
  <rect x="0" y="28" width="940" height="14" fill="#1e293b" />
  <text x="20" y="26" fill="#f8fafc" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700">YogaQ Two-Stage Decoupled Perception Architecture</text>
  
  <!-- Top Badges -->
  <rect x="520" y="10" width="125" height="22" rx="11" fill="rgba(2,132,199,0.25)" stroke="#38bdf8" stroke-width="1" />
  <text x="582" y="25" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">NPU: 20.4ms (30FPS)</text>

  <rect x="655" y="10" width="135" height="22" rx="11" fill="rgba(16,185,129,0.25)" stroke="#34d399" stroke-width="1" />
  <text x="722" y="25" fill="#34d399" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">CPU NumPy: 0.018ms</text>

  <rect x="800" y="10" width="120" height="22" rx="11" fill="rgba(99,102,241,0.25)" stroke="#818cf8" stroke-width="1" />
  <text x="860" y="25" fill="#818cf8" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">RAG p95: 42ms</text>

  <!-- Card 1: 45° Camera Ingestion -->
  <g transform="translate(18, 54)">
    <rect x="0" y="0" width="145" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="145" height="30" rx="10" fill="#334155" />
    <rect x="0" y="20" width="145" height="10" fill="#334155" />
    <text x="72" y="19" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="middle">45° Mat Camera</text>
    
    <text x="72" y="55" fill="#0f172a" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="middle">Sony IMX500</text>
    <text x="72" y="75" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">1080p @ 30.0 FPS</text>
    <text x="72" y="95" fill="#64748b" font-size="9.5" font-family="sans-serif" text-anchor="middle">사각(45°) 배치</text>
    <text x="72" y="112" fill="#64748b" font-size="9.5" font-family="sans-serif" text-anchor="middle">거리: 2.0 ~ 2.5m</text>
    <text x="72" y="129" fill="#64748b" font-size="9.5" font-family="sans-serif" text-anchor="middle">높이: 0.7 ~ 0.9m</text>

    <rect x="12" y="145" width="121" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="72" y="161" fill="#475569" font-size="9.5" font-family="sans-serif" font-weight="600" text-anchor="middle">가림 최소화 지오메트리</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 166 144 L 186 144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Card 2: Stage 1 NPU Vision Backbone -->
  <g transform="translate(190, 54)">
    <rect x="0" y="0" width="225" height="180" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="225" height="30" rx="10" fill="url(#npuGrad)" />
    <rect x="0" y="20" width="225" height="10" fill="#0284c7" />
    <text x="112" y="19" fill="#ffffff" font-size="11.5" font-family="sans-serif" font-weight="700" text-anchor="middle">Stage 1: Hailo-8L NPU (13 TOPS)</text>
    
    <text x="14" y="55" fill="#0369a1" font-size="11" font-family="sans-serif" font-weight="700">• YOLOv8s-Pose INT8 HEF</text>
    <text x="14" y="73" fill="#334155" font-size="10" font-family="sans-serif">  - COCO-17 키포인트 2D 추론</text>
    <text x="14" y="91" fill="#334155" font-size="10" font-family="sans-serif">  - 순수 NPU 지연: <tspan font-family="monospace" font-weight="700" fill="#0284c7">20.4ms</tspan></text>
    <text x="14" y="109" fill="#334155" font-size="10" font-family="sans-serif">  - 프레임레이트: <tspan font-family="monospace" font-weight="700" fill="#0284c7">30.0 FPS 고정</tspan></text>
    <text x="14" y="127" fill="#64748b" font-size="9.5" font-family="sans-serif">  - Zero Cloud Ingress (온디바이스 폐기)</text>

    <rect x="14" y="145" width="197" height="24" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1" />
    <text x="112" y="161" fill="#0284c7" font-size="9.5" font-family="sans-serif" font-weight="700" text-anchor="middle">17개 관절 2D 섀도우 텐서 생성</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 418 144 L 438 144" stroke="#94a3b8" stroke-width="2" />

  <!-- Card 3: 3-Layer Biomechanics & Safe Torso Guard -->
  <g transform="translate(442, 54)">
    <rect x="0" y="0" width="225" height="180" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="225" height="30" rx="10" fill="url(#guardGrad)" />
    <rect x="0" y="20" width="225" height="10" fill="#f59e0b" />
    <text x="112" y="19" fill="#ffffff" font-size="11.5" font-family="sans-serif" font-weight="700" text-anchor="middle">3-Layer Lifting &amp; Torso Guard</text>
    
    <text x="14" y="55" fill="#b45309" font-size="11" font-family="sans-serif" font-weight="700">• Safe Torso Scale Guard</text>
    <text x="14" y="73" fill="#334155" font-size="9.5" font-family="monospace">  scale = max(H_torso, 0.25*ref)</text>
    <text x="14" y="91" fill="#334155" font-size="10" font-family="sans-serif">  - 깊은 전굴 시 12배 몸통 수축 방어</text>
    <text x="14" y="109" fill="#334155" font-size="10" font-family="sans-serif">  - 25배 좌표 폭발 방지 (<tspan font-weight="700" fill="#d97706">max_abs &lt; 4.81</tspan>)</text>
    <text x="14" y="127" fill="#64748b" font-size="9.5" font-family="sans-serif">  - 45° 사각 3D 공간 깊이(Z) 복원</text>

    <rect x="14" y="145" width="197" height="24" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" />
    <text x="112" y="161" fill="#b45309" font-size="9.5" font-family="sans-serif" font-weight="700" text-anchor="middle">42차원 생체역학 정규화 벡터 산출</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 670 144 L 690 144" stroke="#94a3b8" stroke-width="2" />

  <!-- Card 4: Stage 2 CPU Classifier & Markov Debouncer -->
  <g transform="translate(694, 54)">
    <rect x="0" y="0" width="228" height="180" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="228" height="30" rx="10" fill="url(#cpuGrad)" />
    <rect x="0" y="20" width="228" height="10" fill="#10b981" />
    <text x="114" y="19" fill="#ffffff" font-size="11.5" font-family="sans-serif" font-weight="700" text-anchor="middle">Stage 2: ARM Cortex-A76 CPU</text>
    
    <text x="14" y="55" fill="#047857" font-size="11" font-family="sans-serif" font-weight="700">• Pure NumPy AsanaClassifier</text>
    <text x="14" y="73" fill="#334155" font-size="10" font-family="sans-serif">  - 72개 아사나 분류: <tspan font-family="monospace" font-weight="700" fill="#047857">0.018ms</tspan></text>
    <text x="14" y="91" fill="#334155" font-size="10" font-family="sans-serif">  - <tspan font-weight="700" fill="#047857">PCIe DMA(0.5ms) 대비 25배 고속</tspan></text>
    <text x="14" y="109" fill="#334155" font-size="10" font-family="sans-serif">  - 마르코프 윈도우 + 5-Frame 디바운서</text>
    <text x="14" y="127" fill="#64748b" font-size="9.5" font-family="sans-serif">  - vinyasa_transition 완충 / 라벨 지터 제로</text>

    <rect x="14" y="145" width="200" height="24" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" />
    <text x="114" y="161" fill="#047857" font-size="9.5" font-family="sans-serif" font-weight="700" text-anchor="middle">Surya Namaskara 99.9% 확정 잠금</text>
  </g>

  <!-- Bottom Strip: Hybrid RAG & B2B Appliance Economics -->
  <g transform="translate(18, 246)">
    <rect x="0" y="0" width="904" height="68" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="170" height="68" rx="8" fill="url(#ragGrad)" />
    <rect x="160" y="0" width="10" height="68" fill="#6366f1" />
    <text x="85" y="30" fill="#ffffff" font-size="11.5" font-family="sans-serif" font-weight="700" text-anchor="middle">Typesense RAG</text>
    <text x="85" y="48" fill="#e0e7ff" font-size="10" font-family="sans-serif" text-anchor="middle">&amp; B2B Appliance</text>

    <text x="190" y="24" fill="#1e1b4b" font-size="10.5" font-family="sans-serif" font-weight="700">• 초저지연 하이브리드 검색 (p95 42ms)</text>
    <text x="190" y="42" fill="#475569" font-size="9.5" font-family="sans-serif">Dense(1024-dim bge-m3) + BM25 동적 가중치 결합, 165p 전문 도서 OCR 지식베이스 연동</text>
    <text x="190" y="58" fill="#475569" font-size="9.5" font-family="sans-serif">신체 금기 조건(디스크·임신) 페널티 마스킹으로 <tspan font-weight="700" fill="#4338ca">부적절 동작 추천 85% 차단</tspan></text>

    <line x1="620" y1="10" x2="620" y2="58" stroke="#e2e8f0" stroke-width="1" />

    <text x="640" y="24" fill="#047857" font-size="10.5" font-family="sans-serif" font-weight="700">• $140 PoE 단일 어플라이언스 경제성</text>
    <text x="640" y="42" fill="#475569" font-size="9.5" font-family="sans-serif">RPi5($60) + Hailo-8L($70) + Cam($10) 단일 PoE 케이블 구동</text>
    <text x="640" y="58" fill="#047857" font-size="9.5" font-family="sans-serif" font-weight="700">매트당 월 $720 클라우드 GPU 비용 ➔ $0.00 완전 제거 (B2B SaaS 마진 92%+)</text>
  </g>
</svg>